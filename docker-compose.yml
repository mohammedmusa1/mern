version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: fusion-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=Ecommerce-Products

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fusion-backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    environment:
      - PORT=8000
      - MONGO_URI=mongodb://mongodb:27017/Ecommerce-Products
      - JWT_SECRET=${JWT_SECRET:-supersecretkey}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_HOST=${PINECONE_HOST}
      - PINECONE_INDEX=${PINECONE_INDEX}
      - GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY}
      - SKIP_SEED_ON_START=true

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_BASE_URL=http://3.91.38.23:8000/api
    container_name: fusion-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
